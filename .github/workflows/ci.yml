name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
    outputs:
      version:
        description: Package version from Cargo.toml
        value: ${{ jobs.init.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  init:
    name: Initial Job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout Code 
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Cache Rust 
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libsqlite3-dev pkg-config
      - name: Read package version
        id: metadata
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Reject bundled SQLite feature
        run: |
          set -euo pipefail
          features="$(cargo metadata --locked --format-version 1 \
            | jq -r '(.packages[] | select(.name == "whatsapp-rust") | .id) as $id
                     | .resolve.nodes[] | select(.id == $id) | .features[]')"
          if grep -qxF "sqlite-storage-bundled" <<<"$features"; then
            echo "::error::whatsapp-rust resolved with sqlite-storage-bundled; it bundles SQLite and collides with libsql-ffi's sqlite3 symbols"
            exit 1
          fi
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

