[package]
name = "send-rs"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
ratatui = "0.30"

# Image rendering in popups. 
# no `chafa-dyn`/libchafa system dependency, halfblocks stays the fallback.
ratatui-image = { version = "11", default-features = false, features = [
  "crossterm",
] }
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }

thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "signal",
] }

grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
grammers-tl-types = "0.10"

# whatsapp-rust's `sqlite-storage` feature (upstream >= PR #1499) no longer
# bundles SQLite by default: bundling moved to a separate `sqlite-storage-bundled`
# feature. We keep `default-features = false` + `sqlite-storage` so the storage
# links against system libsqlite3 and does NOT collide with grammers-session's
# libsql-ffi at link time (duplicate sqlite3 symbols). Do NOT enable
# `sqlite-storage-bundled`.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", default-features = false, features = [
  "sqlite-storage",
  "tokio-transport",
  "tokio-runtime",
  "ureq-client",
  "tokio-native",
] }

qrcode = "0.14"
notify-rust = "4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ratatui-textarea = "0.9.2"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
# fix for an ALSA error i was having: 
# 'ALSA lib pcm.c:8787:(snd_pcm_recover) [error.pcm] underrun occurred' was appearing in progress bar
tracing-log = "0.2"

rodio = { version = "0.21.1", features = ["tracing"] }
# rodio 0.21.1 is pinned because 0.22 renamed Sink
# to Player; opus-pure decodes Opus voice notes (Opus-in-Ogg) with no C deps.
# rodio's `tracing` feature routes its stream-drop/error notices through
# `tracing` (→ sender.log) instead of `eprintln!` into the TUI's alternate
# screen. `rustix::stdio::dup2_stderr` (safe) redirects the process stderr to
# the same log file so alsa-lib's own diagnostics (underruns while seeking)
# never corrupt the terminal either; the crate was already in the tree as a
# transitive dependency, so `features = ["stdio"]` adds no new download.
rustix = { version = "1.1", features = ["stdio"] }
opus-pure = "0.2.1"
# Mic capture for voice-note recording. Already in the tree via rodio's
# playback, so this adds no new download. On Linux the ALSA target dep needs
# `libasound2-dev` at build time; macOS (CoreAudio) and Windows (WASAPI) need
# nothing extra. Default features on, no `jack` (optional).
cpal = "0.16"
