[package]
name = "senders"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
ratatui = "0.30"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

grammers-client = "0.10"

whatsapp-rust = { git = "https://github.com/jlucaso1/whatsapp-rust", tag = "v0.7.0", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
whatsapp-rust-sqlite-storage = { git = "https://github.com/jlucaso1/whatsapp-rust", tag = "v0.7.0" }
whatsapp-rust-chat-store = { git = "https://github.com/jlucaso1/whatsapp-rust", tag = "v0.7.0" }

qrcode = "0.14"
notify-rust = "4"
