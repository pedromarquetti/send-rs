[package]
name = "senders"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
ratatui = "0.30"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "signal",
] }

grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
grammers-tl-types = "0.10"

# BUG: whatsapp-rust's internal dep on whatsapp-rust-sqlite-storage forces
# bundled-sqlite even with default-features = false on our direct dependency.
# This conflicts with grammers-session's libsql-ffi at link time (duplicate
# sqlite3 symbols). Re-enable when whatsapp-rust adds a no-bundled feature.
# NOTE: This is a local fix that apparently works but needs to be tested 
# whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", default-features = false, features = [
whatsapp-rust = { path = "/home/phlm/Documents/programming/rust/whatsapp-rust", default-features = false, features = [
  "sqlite-storage",
  "tokio-transport",
  "tokio-runtime",
  "ureq-client",
  "tokio-native",
] }

qrcode = "0.14"
notify-rust = "4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ratatui-textarea = "0.9.2"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
